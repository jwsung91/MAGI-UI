<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAGI-UI</title>
<!--
  MAGI-UI: a single-file viewer for results of the MAGI skill (result format version 2).
  Open this file in a browser and drop result files or a results folder on the page, or click MAGI
  to choose a folder. Click 議題 for the agenda, 決議 for the resolution, a unit for its opinion;
  the left and right arrow keys move between the results loaded.
  Files are read locally with the File API; nothing is sent anywhere.

  The screen is the one of TomaszRewak/MAGI (https://github.com/TomaszRewak/MAGI, MIT License,
  Copyright (c) 2023 Tomasz Rewak): its style.css is included unchanged in the first <style>
  block below, and the markup follows its React components. See THIRD_PARTY_NOTICES.md.
  The kanji use "MAGI Kanji Serif", a subset of Noto Serif JP (SIL Open Font License,
  fonts/OFL.txt), embedded as base64 (source: fonts/magi-kanji-serif.woff2).
-->
<style>
/* ---- TomaszRewak/MAGI assets/style.css, unchanged (MIT License, Copyright (c) 2023 Tomasz Rewak) ---- */
html {
    background: repeating-linear-gradient(45deg, rgb(0 0 0) 0px, rgb(0 0 0) 20px, #140b02 20px, #140b02 40px);
    min-height: 100vh;
}

body {
    margin: 15px;
}

.system {
    background: black;
    border: 2px solid #ff8d00;
    padding: 15px;
    max-width: 1200px;
    display: flex;
    flex-direction: column;
    position: relative;
    margin: 0 auto;
}

.magi {
    display: grid;
    grid-template-columns:
        /**/
        [left-header-start]
        /**/
        20px
        /**/
        [casper-start status]
        /**/
        2fr
        /**/
        [left-header-end balthasar-start casper-balthasar-connection]
        /**/
        0.5fr
        /**/
        [casper-end title casper-melchior-connection]
        /**/
        1fr
        /**/
        [balthasar-melchior-connection melchior-start]
        /**/
        0.5fr
        /**/
        [right-header-start balthasar-end response]
        /**/
        2fr
        /**/
        [melchior-end]
        /**/
        20px
        /**/
        [right-header-end];
    grid-template-rows:
        /**/
        20px
        /**/
        [header balthasar-start]
        /**/
        2fr
        /**/
        [status response]
        /**/
        2fr
        /**/
        [casper-start melchior-start casper-balthasar-connection balthasar-melchior-connection]
        /**/
        1fr
        /**/
        [balthasar-end title casper-melchior-connection]
        /**/
        3fr
        /**/
        [casper-end melchior-end]
        /**/
        20px;
    aspect-ratio: 2 / 1;
    container-type: size;
    border: 2px solid #ff8d00;
}

.magi>.title {
    grid-area: title / title;
    color: #ff8d00;
    text-align: center;
    font-size: 9cqh;
    font-weight: bold;
}

.magi>.header {
    overflow: hidden;
}

.magi>.header>hr {
    border: 2px solid #277547;
    height: 4px;
    margin: 2px;
}

.magi>.header>span {
    color: #ff8d00;
    font-size: 10cqh;
    display: flex;
    justify-content: center;
    font-weight: bold;
    transform: scaleX(2);
}

.magi>.header.left {
    grid-area: header / left-header-start / auto / left-header-end;
}

.magi>.header.right {
    grid-area: header / right-header-start / auto / right-header-end;
}

.magi>.system-status {
    grid-area: status;
    font-family: 'Helvetica';
    font-family: 'Lucida Console';
    color: #ff8d00;
}

.magi>.system-status>div {
    font-size: 3cqh;
    margin-left: 4cqw;
    transform: scaleX(1.2);
    transform-origin: left;
}

.magi>.system-status>div:first-child {
    font-size: 6cqh;
    margin-left: 0;
}

.magi>.response {
    grid-area: response;
    justify-self: flex-end;
    align-self: center;
    border: solid 2px;
    padding: 2px;
}

.magi>.response>.inner {
    white-space: nowrap;
    border: solid 2px;
    padding: 2px 10px;
    font-size: 8cqh;
    font-weight: bold;
}

.magi>.wise-man {
    display: flex;
    background: #ff8d00;
    padding: 2px;
    cursor: pointer;
}

.magi>.wise-man>.inner {
    width: 100%;
    height: 100%;
    font-family: Helvetica;
    font-size: 8cqh;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
}

.magi>.wise-man.melchior {
    grid-area: melchior-start / melchior-start / melchior-end / melchior-end;
}

.magi>.wise-man.melchior,
.magi>.wise-man.melchior>.inner {
    clip-path: polygon(35% 0, 100% 0, 100% 100%, 0 100%, 0 44%)
}

.magi>.wise-man.balthasar {
    grid-area: balthasar-start / balthasar-start / balthasar-end / balthasar-end;
}

.magi>.wise-man.balthasar,
.magi>.wise-man.balthasar>.inner {
    clip-path: polygon(0 0, 100% 0, 100% 80%, 75% 100%, 25% 100%, 0 80%);
}

.magi>.wise-man.casper {
    grid-area: casper-start / casper-start / casper-end / casper-end;
}

.magi>.wise-man.casper,
.magi>.wise-man.casper>.inner {
    clip-path: polygon(0 0, 65% 0, 100% 44%, 100% 100%, 0 100%);
}

@keyframes flicker-animation {
    0% {}

    50% {
        background: black;
        color: black;
        border-color: black;
    }
}

.flicker {
    animation: flicker-animation 0.25s infinite step-end;
}


.connection {
    height: 10px;
    background: #ff8d00;
    align-self: center;
    margin: -10%;
}

.connection.casper-balthasar {
    grid-area: casper-balthasar-connection;
    transform: rotate(-54deg);
}

.connection.casper-melchior {
    grid-area: casper-melchior-connection;
}

.connection.balthasar-melchior {
    grid-area: balthasar-melchior-connection;
    transform: rotate(54deg);
}

.modal {
    border: 2px solid #ff8d00;
    color: #ff8d00;
    font-family: 'Helvetica';
    font-family: 'Lucida Console';
    position: absolute;
    background: black;
    max-width: 60%;
    top: 10%;
    right: 10%;
}

.modal>.modal-header {
    display: flex;
    flex-direction: row;
    border-bottom: 2px solid #ff8d00;
}

.modal>.modal-header>.modal-title {
    flex: 1;
    padding: 5px;
    background: repeating-linear-gradient(45deg, rgb(0 0 0) 0px, rgb(0 0 0) 10px, #211200 10px, #211200 20px);
}

.modal>.modal-header>.close {
    padding: 5px;
    border-left: 2px solid #ff8d00;
    cursor: pointer;
}

.modal>.modal-body {
    display: grid;
    grid-template-columns: auto auto;
    column-gap: 10px;
    padding: 10px;
}

.input-container {
    display: grid;
    grid-template-columns: auto 1fr;
    color: #ff8d00;
    font-family: 'Helvetica';
    font-family: 'Lucida Console';
    column-gap: 10px;
    row-gap: 5px;
    margin-top: 15px;
}

.input-container>input {
    background: #1f1203;
    border: 2px solid #ff8d00;
    color: #ff8d00;
}
/* ---- end of TomaszRewak/MAGI style.css ---- */
</style>

/* Serif kanji. Upstream stretches the header kanji 2x, which squashes a serif face; 1.3x. */
.magi>.header>span,
.magi>.response>.inner {
    font-family: 'MAGI Kanji Serif', 'Noto Serif CJK JP', 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
}
.magi>.header>span { transform: scaleX(1.3); }

/* The status lines in a monospace face even where Lucida Console is missing. */
.magi>.system-status, .modal {
    font-family: 'Lucida Console', 'DejaVu Sans Mono', Consolas, monospace;
}

/* Upstream's .modal is positioned against the .system box. */
.modal { z-index: 10; max-height: 80%; overflow: auto; }
.modal>.modal-body>div:nth-child(odd) { white-space: nowrap; }
.modal>.modal-body>div:nth-child(even) { color: #ffd29a; overflow-wrap: anywhere; }
.modal ul { margin: 0; padding-left: 1.2em; }
.modal .note { color: #ff8d00; }

/* No input row: drop files or click MAGI to load; click the headers and panels to read. */
.magi>.header, .magi>.response, .magi>.title { cursor: pointer; }
#pick-folder { display: none; }
body.over .system { outline: 3px dashed #ff8d00; outline-offset: 6px; }

<body>
<div class="system" id="system">
    <div class="magi" id="magi">
        <div class="connection casper-balthasar"></div>
        <div class="connection casper-melchior"></div>
        <div class="connection balthasar-melchior"></div>
        <div class="header left" id="agenda-header" title="agenda"><hr><hr><span>議 題</span><hr><hr></div>
        <div class="header right" id="resolution-header" title="resolution"><hr><hr><span>決 議</span><hr><hr></div>
        <div class="system-status" id="status"></div>
        <div class="wise-man melchior" data-unit="melchior"><div class="inner">MELCHIOR • 1</div></div>
        <div class="wise-man balthasar" data-unit="balthasar"><div class="inner">BALTHASAR • 2</div></div>
        <div class="wise-man casper" data-unit="casper"><div class="inner">CASPER • 3</div></div>
        <div class="response" id="response"><div class="inner" id="response-text">情 報</div></div>
        <div class="title" id="magi-title" title="choose a results folder">MAGI</div>
    </div>
    <input type="file" id="pick-folder" webkitdirectory multiple>
    <div class="modal" id="modal" hidden>
        <div class="modal-header"><div class="modal-title" id="modal-title"></div><div class="close" id="modal-close">X</div></div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<script>
'use strict';

const UNITS = [
    { key: 'melchior', name: 'melchior', label: 'MELCHIOR-1' },
    { key: 'balthasar', name: 'balthasar', label: 'BALTHASAR-2' },
    { key: 'casper', name: 'casper', label: 'CASPER-3' },
];
const MODES = ['deliberation', 'information'];
const GRADES = ['normal', 'critical'];
const VERDICTS = ['passed', 'rejected', 'on_hold', 'error'];
const UNIT_VERDICTS = ['approve', 'reject', 'error'];

// Upstream's colors (components/wise_man.js and response.js).
const PANEL = { approve: '#52e691', reject: '#a41413', info: '#3caee0', error: 'black' };
// The result box: 可決 / 否決 rather than upstream's 合意 / 拒絶, since a 2/3 pass is not an
// agreement; 異常 rather than 誤差 for a failed unit. On hold (skill versions before 1.6.0)
// shows 情報 with a note, as upstream's adapter did.
const RESPONSE = {
    passed: { text: '可 決', color: '#52e691' },
    rejected: { text: '否 決', color: '#a41413' },
    on_hold: { text: '情 報', color: '#3caee0' },
    error: { text: '異 常', color: 'gray' },
    information: { text: '情 報', color: '#3caee0' },
};

const TEXT = {
    en: {
        agendaTitle: 'agenda', resolutionTitle: 'resolution', followUps: 'follow-ups:', position: 'result:',
        question: 'question:', file: 'file:', resolution: 'resolution:', verdict: 'verdict:', confidence: 'confidence:',
        perspective: 'perspective:', rationale: 'rationale:', flip: 'would flip:', premise: 'doubted premise:',
        recommend: 'recommendations:', answer: 'answer:', error: 'error:', followUp: 'follow-up', minority: 'minority:',
        approve: 'approve', reject: 'reject', high: 'high', medium: 'medium', low: 'low',
        normal: 'normal', critical: 'critical',
        passed: 'passed', rejected: 'rejected', on_hold: 'on hold', information: 'information',
        majority: n => `* passed by ${n}/3: a normal proposal needs two of the three aspects`,
        unanimity: n => `* rejected with ${n}/3 approvals: a critical proposal needs all three`,
        hold: '* on hold: a result of a skill version before 1.6.0 (no screen label, shown as 情報)',
        unitError: '* a unit failed, so the resolution is an error rather than a vote of two',
        invalid: m => `result format error: ${m}`, json: m => `JSON error: ${m}`,
        waiting: 'Drop result files or a results folder on the page, or click MAGI to choose a folder.',
    },
    ko: {
        agendaTitle: '안건', resolutionTitle: '결의', followUps: '[후속 안건]', position: '[결과]',
        question: '[안건]', file: '[파일]', resolution: '[결의]', verdict: '[판정]', confidence: '[확신도]',
        perspective: '[관점]', rationale: '[근거]', flip: '[뒤집힐 조건]', premise: '[의심하는 전제]',
        recommend: '[권고]', answer: '[답]', error: '[오류]', followUp: '[후속', minority: '[소수 의견]',
        approve: '승인', reject: '거부', high: '높음', medium: '중간', low: '낮음',
        normal: '정상 등급', critical: '중대 등급',
        passed: '가결', rejected: '부결', on_hold: '보류', information: '정보',
        majority: n => `※ ${n}/3 가결: 정상 등급은 세 측면 중 둘이면 가결`,
        unanimity: n => `※ ${n}/3 승인으로 부결: 중대 등급은 셋 모두 승인해야 함`,
        hold: '※ 보류: 스킬 1.6.0 이전 버전의 결과 (대응하는 화면 라벨이 없어 情報로 표시)',
        unitError: '※ 유닛 하나가 실패해서 두 유닛의 표로 정하지 않고 오류로 처리',
        invalid: m => `결과 형식 오류: ${m}`, json: m => `JSON 형식 오류: ${m}`,
        waiting: '결과 파일이나 결과 폴더를 화면에 끌어다 놓거나, MAGI를 눌러 폴더를 고르세요.',
    },
};
const LANG = (new URLSearchParams(location.search).get('lang') || navigator.language || 'en').toLowerCase().startsWith('ko') ? 'ko' : 'en';
const T = TEXT[LANG];
document.documentElement.lang = LANG;

const PRESETS = [
    [['code review', '코드 리뷰', '코드리뷰'], 'CODE_REVIEW'],
    [['personal', '개인'], 'PERSONAL'],
    [['ethic', '윤리'], 'ETHICS'],
    [['original', '원작', '오리지널'], 'ORIGINAL'],
    [['custom', '커스텀', '맞춤', '사용자'], 'CUSTOM'],
    [['default', '기본'], 'DEFAULT'],
];

const $ = id => document.getElementById(id);
function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    for (const c of children) if (c !== null && c !== undefined && c !== '') node.append(c);
    return node;
}

// --- validation: the core rules of result.schema.json, version 2 ---
class ResultError extends Error {}
function validate(d) {
    const fail = m => { throw new ResultError(m); };
    if (!d || typeof d !== 'object' || Array.isArray(d)) fail('top level is not an object');
    if (d.version !== 2) fail('version must be 2 (update the skill or this viewer)');
    if (!MODES.includes(d.mode)) fail(`mode must be one of ${MODES.join(', ')}`);
    if (typeof d.agenda !== 'string' || !d.agenda.trim()) fail('agenda is empty');
    const units = d.units;
    if (!units || typeof units !== 'object' || Object.keys(units).sort().join() !== 'balthasar,casper,melchior')
        fail('units must contain exactly melchior, balthasar, casper');
    if (d.mode === 'deliberation') {
        if (!GRADES.includes(d.grade)) fail(`grade must be one of ${GRADES.join(', ')}`);
        if (!VERDICTS.includes(d.verdict)) fail(`verdict must be one of ${VERDICTS.join(', ')}`);
        for (const u of UNITS)
            if (!UNIT_VERDICTS.includes((units[u.key] || {}).verdict)) fail(`units.${u.key}.verdict must be one of ${UNIT_VERDICTS.join(', ')}`);
        if (d.follow_ups !== undefined) {
            if (!Array.isArray(d.follow_ups) || d.follow_ups.length > 2) fail('follow_ups must be a list of at most 2');
            d.follow_ups.forEach((f, i) => {
                if (!f || typeof f.agenda !== 'string') fail(`follow_ups[${i}].agenda is missing`);
                if (!VERDICTS.includes(f.verdict)) fail(`follow_ups[${i}].verdict must be one of ${VERDICTS.join(', ')}`);
                if (f.units !== undefined) for (const u of UNITS)
                    if (!f.units[u.key] || !UNIT_VERDICTS.includes(f.units[u.key].verdict))
                        fail(`follow_ups[${i}].units.${u.key}.verdict must be one of ${UNIT_VERDICTS.join(', ')}`);
            });
        }
    }
}

// --- status lines: CODE from the file name's time, EXTENTION the preset, PRIORITY the grade ---
function presetCode(preset) {
    let head = String(preset || '').trim().toLowerCase();
    head = head.split('—')[0].split(' - ')[0].split(':')[0].split('(')[0];
    for (const [words, code] of PRESETS)
        if (words.some(w => head.startsWith(w) || head.includes(' ' + w))) return code;
    return head ? 'CUSTOM' : '----';
}
function statusFields(d, file) {
    if (!file) return { code: '473', ext: '????', priority: 'AAA' };   // upstream's look before a query
    if (!d) return { code: '????', ext: '????', priority: '????' };
    const m = /^\d{8}-(\d{4})\d{2}-/.exec(file.name);
    const time = m ? m[1] : new Date(file.lastModified).toTimeString().slice(0, 5).replace(':', '');
    return { code: time, ext: presetCode(d.preset), priority: { critical: 'AAA', normal: 'A' }[d.grade] || '----' };
}

const approvals = p => p.approve_count ?? UNITS.filter(u => p.units[u.key].verdict === 'approve').length;
function noteFor(d) {
    if (d.mode !== 'deliberation') return '';
    const n = approvals(d);
    if (d.verdict === 'on_hold') return T.hold;
    if (d.verdict === 'error') return T.unitError;
    if (d.verdict === 'passed' && n < 3) return T.majority(n);
    if (d.verdict === 'rejected' && d.grade === 'critical' && (n === 1 || n === 2)) return T.unanimity(n);
    return '';
}

// --- the screen ---
let current = null;   // { data, file, error }

function flicker(node) {
    node.classList.add('flicker');
    setTimeout(() => node.classList.remove('flicker'), 700);
}

function render(animate) {
    const d = current && current.data;
    const s = statusFields(d, current && current.file);
    $('status').replaceChildren(
        el('div', {}, `CODE:${s.code}`), el('div', {}, 'FILE:MAGI_SYS'), el('div', {}, `EXTENTION:${s.ext}`),
        el('div', {}, 'EX_MODE:OFF'), el('div', {}, `PRIORITY:${s.priority}`));

    const key = !current ? 'information' : current.error ? 'error' : d.mode === 'information' ? 'information' : d.verdict;
    const r = RESPONSE[key];
    const box = $('response');
    box.style.color = r.color;
    box.style.borderColor = r.color;
    $('response-text').textContent = r.text;

    for (const u of UNITS) {
        const inner = document.querySelector(`.wise-man.${u.key}>.inner`);
        const unit = d && d.units[u.key];
        inner.style.background = !current ? PANEL.info : current.error ? PANEL.error
            : d.mode === 'information' ? PANEL.info : PANEL[unit.verdict];
        if (animate) flicker(inner);
    }
    if (animate) flicker(box);
    if (openWindow) showWindow(openWindow);
}

const list = items => el('ul', {}, ...items.map(i => el('li', {}, String(i))));
let openWindow = null;   // 'agenda', 'resolution', or a unit key
function showWindow(kind) {
    openWindow = kind;
    const rows = [];
    const add = (label, value) => {
        if (value === undefined || value === null || value === '' || (Array.isArray(value) && !value.length)) return;
        rows.push(el('div', {}, label), el('div', {}, Array.isArray(value) ? list(value) : String(value)));
    };
    const unit = UNITS.find(x => x.key === kind);
    $('modal-title').textContent = unit ? unit.name : kind === 'agenda' ? T.agendaTitle : T.resolutionTitle;
    if (!current) {
        rows.push(el('div', {}), el('div', {}, T.waiting));
    } else if (current.error) {
        add(T.file, current.file.name);
        add(T.error, current.error);
    } else {
        const d = current.data;
        if (kind === 'agenda') {
            add(T.question, d.agenda);
            add(T.followUps, (d.follow_ups || []).map((f, i) => `${i + 1}. ${f.agenda}`));
            add(T.file, current.file.name);
            if (files.length > 1) add(T.position, `${files.indexOf(current.file) + 1} / ${files.length}  (← →)`);
        } else if (kind === 'resolution') {
            if (d.mode === 'deliberation') {
                add(T.resolution, `${T[d.verdict] || d.verdict} (${approvals(d)}/3) · ${T[d.grade]}${d.grade_raised ? ' ↑' : ''}`);
                const note = noteFor(d);
                if (note) rows.push(el('div', {}), el('div', { class: 'note' }, note));
                (d.follow_ups || []).forEach((f, i) => {
                    const label = LANG === 'ko' ? `${T.followUp} ${i + 1}]` : `${T.followUp} ${i + 1}:`;
                    add(label, `${T[f.verdict] || f.verdict} (${approvals(f)}/3)${f.grade ? ' · ' + T[f.grade] : ''}`);
                });
                add(T.minority, d.minority);
            } else {
                add(T.resolution, T.information);
            }
        } else if (d.mode === 'deliberation') {
            const u = d.units[kind];
            add(T.perspective, u.perspective);
            add(T.verdict, [T[u.verdict] || u.verdict, u.confidence ? `${T.confidence.replace(/[\[\]:]/g, '')} ${T[u.confidence] || u.confidence}` : ''].filter(Boolean).join(' · '));
            add(T.error, u.error);
            add(T.rationale, u.rationale);
            add(T.flip, u.flip_condition);
            add(T.premise, u.doubted_premise);
            add(T.recommend, u.recommendations);
            (d.follow_ups || []).forEach((f, i) => {
                const fu = f.units && f.units[kind];
                if (!fu) return;
                const label = LANG === 'ko' ? `${T.followUp} ${i + 1}]` : `${T.followUp} ${i + 1}:`;
                add(label, [f.agenda, `${T[fu.verdict] || fu.verdict}${fu.confidence ? ' · ' + (T[fu.confidence] || fu.confidence) : ''}`, ...(fu.rationale || []), fu.error || ''].filter(Boolean));
            });
        } else {
            const u = d.units[kind];
            add(T.perspective, u.perspective);
            add(T.answer, u.answer);
        }
    }
    $('modal-body').replaceChildren(...rows);
    $('modal').hidden = false;
}

// --- loading ---
let files = [];
function setFiles(incoming) {
    files = [...incoming].filter(f => f.name.toLowerCase().endsWith('.json'))
        .sort((a, b) => (b.name > a.name) - (b.name < a.name) || b.lastModified - a.lastModified);
    if (files.length) load(files[0]);
}
async function load(file) {
    let data, error = null;
    try {
        data = JSON.parse(await file.text());
        validate(data);
    } catch (e) {
        if (e instanceof SyntaxError) error = T.json(e.message);
        else if (e instanceof ResultError) error = T.invalid(e.message);
        else throw e;
        data = null;
    }
    current = { data, file, error };
    render(true);
}

$('pick-folder').addEventListener('change', e => setFiles(e.target.files));
$('magi-title').addEventListener('click', () => $('pick-folder').click());
$('agenda-header').addEventListener('click', () => showWindow('agenda'));
$('resolution-header').addEventListener('click', () => showWindow('resolution'));
$('response').addEventListener('click', () => showWindow('resolution'));
$('modal-close').addEventListener('click', () => { openWindow = null; $('modal').hidden = true; });
document.querySelectorAll('.wise-man').forEach(w => w.addEventListener('click', () => showWindow(w.dataset.unit)));
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { openWindow = null; $('modal').hidden = true; return; }
    if (!current || files.length < 2 || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    const i = files.indexOf(current.file) + (e.key === 'ArrowRight' ? 1 : -1);
    if (i >= 0 && i < files.length) load(files[i]);
});
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('over'); });
document.addEventListener('dragleave', () => document.body.classList.remove('over'));
document.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('over'); setFiles(e.dataTransfer.files); });
render(false);
</script>
</body>

:root {
    --frame: #ff8a00;
    --frame-dim: #7a4300;
    --rule: #2f7d52;
    --bg: #050302;
    --approve: #4ad98a;
    --reject: #b3191a;
    --info: #38a9dc;
    --hold: #e09a2c;
    --error: #6f6f6f;
    --mono: 'Lucida Console', 'DejaVu Sans Mono', Consolas, monospace;
    --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --kanji: 'MAGI Kanji Serif', 'Noto Serif CJK JP', 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
}

* { box-sizing: border-box; }

html {
    min-height: 100vh;
    background: repeating-linear-gradient(-45deg, #000 0 18px, #120a02 18px 36px);
}

body {
    margin: 16px;
    color: var(--frame);
    font-family: var(--mono);
}

.console {
    max-width: 1200px;
    margin: 0 auto;
    background: var(--bg);
    border: 2px solid var(--frame);
    padding: 14px;
}

/* --- top band: agenda on the left, resolution on the right --- */
.band {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.plate {
    border: 2px solid var(--frame);
    padding: 10px 14px 12px;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.plate-title {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
}

.plate-title::before, .plate-title::after {
    content: '';
    height: 10px;
    border-top: 3px double var(--rule);
    border-bottom: 3px double var(--rule);
}

.kanji {
    font-family: var(--kanji);
    font-weight: 800;
    letter-spacing: 0.35em;
    margin-right: -0.35em;
}

.plate-title .kanji {
    font-size: clamp(28px, 5vw, 54px);
    display: inline-block;
    margin: 0 0.45em;
    padding-left: 0.35em;   /* balances the trailing letter-spacing */
    transform: scaleX(1.3);
}

.agenda {
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.35;
    color: #ffd29a;
    overflow-wrap: anywhere;
}

.status-lines {
    margin-top: auto;
    font-size: 13px;
    line-height: 1.35;
    letter-spacing: 0.04em;
}

.status-lines .code { font-size: 26px; }

.resolution {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
}

.badge {
    border: 2px solid currentColor;
    padding: 3px;
}

.badge > span {
    display: block;
    border: 2px solid currentColor;
    margin: 0;
    padding: 4px 14px 4px calc(14px + 0.35em);   /* letter-spacing leaves room on the right */
    font-size: clamp(26px, 4vw, 44px);
}

.count {
    font-family: var(--sans);
    font-size: 20px;
    color: #ffd29a;
}

.note {
    font-family: var(--sans);
    font-size: 14px;
    color: #ffd29a;
    line-height: 1.4;
}

/* --- the three units --- */
.units {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 0.55fr 1fr;
    grid-template-rows: auto auto;
    gap: 18px 0;
    margin: 18px 0 6px;
}

.unit {
    border: 2px solid var(--frame);
    padding: 3px;
    cursor: pointer;
    background: none;
    color: inherit;
    font: inherit;
    text-align: center;
}

.unit:focus-visible, .unit.selected { border-color: #fff; }

.unit .face {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    min-height: 130px;
    padding: 10px;
    color: #000;
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
}

.unit .name {
    font-family: var(--sans);
    font-weight: 700;
    font-size: clamp(20px, 3vw, 34px);
    letter-spacing: 0.02em;
}

.unit .perspective {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
}

.unit.balthasar { grid-column: 1 / 4; grid-row: 1; justify-self: center; width: 44%; }
.unit.casper { grid-column: 1; grid-row: 2; }
.unit.melchior { grid-column: 3; grid-row: 2; }

.core {
    grid-column: 2;
    grid-row: 2;
    align-self: center;
    text-align: center;
    font-family: var(--sans);
    font-weight: 700;
    font-size: clamp(26px, 4vw, 46px);
    letter-spacing: 0.08em;
}

.core::before, .core::after {
    content: '';
    display: block;
    height: 4px;
    margin: 8px 12%;
    background: var(--frame);
}

/* --- details --- */
.details {
    border: 2px solid var(--frame-dim);
    margin-top: 14px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.5;
    min-height: 64px;
}

.details h2 {
    margin: 0 0 6px;
    font-size: 15px;
    letter-spacing: 0.06em;
}

.details dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 4px 14px;
    margin: 0;
}

.details dt { color: var(--frame); }
.details dd { margin: 0; color: #ffe2bd; font-family: var(--sans); overflow-wrap: anywhere; }
.details ul { margin: 0; padding-left: 18px; }
.muted { color: var(--frame-dim); }

/* --- loading --- */
.loader {
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 10px;
    align-items: center;
    margin-top: 14px;
    font-size: 13px;
}

.loader label {
    border: 2px solid var(--frame);
    padding: 4px 10px;
    cursor: pointer;
}

.loader input[type=file] { display: none; }

.loader select {
    background: #1b0f02;
    color: var(--frame);
    border: 2px solid var(--frame);
    font: inherit;
    padding: 3px 6px;
    min-width: 0;
}

.dropzone.over .console { outline: 3px dashed var(--frame); outline-offset: 6px; }

.error-text { color: #ff6b5e; }

@media (max-width: 720px) {
    .band { grid-template-columns: 1fr; }
    .unit.balthasar { width: 70%; }
}
</style>
</head>
<body class="dropzone">
<main class="console">
    <section class="band">
        <div class="plate">
            <div class="plate-title"><span class="kanji">議題</span></div>
            <div class="agenda" id="agenda"></div>
            <div class="status-lines" id="status"></div>
        </div>
        <div class="plate">
            <div class="plate-title"><span class="kanji">決議</span></div>
            <div class="resolution">
                <div class="badge" id="badge"><span class="kanji" id="badge-text">情報</span></div>
                <div class="count" id="count"></div>
            </div>
            <div class="note" id="note"></div>
        </div>
    </section>

    <section class="units" id="units"></section>

    <section class="details" id="details" aria-live="polite"></section>

    <section class="loader">
        <label><input type="file" id="pick-folder" webkitdirectory multiple><span id="label-folder"></span></label>
        <label><input type="file" id="pick-files" accept=".json,application/json" multiple><span id="label-files"></span></label>
        <select id="results" aria-label="results"></select>
    </section>
</main>

    ko: {
        folder: '결과 폴더', files: '결과 파일', none: '— 불러온 결과 없음 —',
        waiting: '결과 폴더를 고르거나 결과 파일을 화면에 끌어다 놓으세요.',
        clickUnit: '유닛을 누르면 그 유닛의 의견이 보입니다.',
        verdict: '판정', confidence: '확신도', rationale: '근거', flip: '뒤집힐 조건',
        premise: '의심하는 전제', recommend: '권고', answer: '답', error: '오류',
        perspective: '관점', followUp: '후속', minority: '소수 의견',
        approve: '승인', reject: '거부', high: '높음', medium: '중간', low: '낮음',
        normal: '정상 등급', critical: '중대 등급',
        passed: '가결', rejected: '부결', on_hold: '보류', information: '정보',
        approvals: n => `승인 ${n}/3`,
        majority: n => `${n}/3 가결: 정상 등급은 세 측면 중 둘이면 가결입니다.`,
        unanimity: n => `${n}/3 승인으로 부결: 중대 등급은 셋 모두 승인해야 합니다.`,
        hold: '보류 (스킬 1.6.0 이전 버전의 결과).',
        unitError: '유닛 하나가 실패해서, 두 유닛의 표로 정하지 않고 오류로 처리했습니다.',
        invalid: m => `결과 형식 오류: ${m}`, json: m => `JSON 형식 오류: ${m}`,
    },
};
const LANG = (new URLSearchParams(location.search).get('lang') || navigator.language || 'en').toLowerCase().startsWith('ko') ? 'ko' : 'en';
const T = TEXT[LANG];
document.documentElement.lang = LANG;

const PRESETS = [
    [['code review', '코드 리뷰', '코드리뷰'], 'CODE_REVIEW'],
    [['personal', '개인'], 'PERSONAL'],
    [['ethic', '윤리'], 'ETHICS'],
    [['original', '원작', '오리지널'], 'ORIGINAL'],
    [['custom', '커스텀', '맞춤', '사용자'], 'CUSTOM'],
    [['default', '기본'], 'DEFAULT'],
];

const $ = id => document.getElementById(id);
function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') node.className = v;
        else if (k === 'style') Object.assign(node.style, v);
        else node.setAttribute(k, v);
    }
    for (const c of children) if (c !== null && c !== undefined) node.append(c);
    return node;
}

// --- validation: the core rules of result.schema.json, version 2 ---
class ResultError extends Error {}
function validate(d) {
    const fail = m => { throw new ResultError(m); };
    if (!d || typeof d !== 'object' || Array.isArray(d)) fail('top level is not an object');
    if (d.version !== 2) fail('version must be 2 (update the skill or this viewer)');
    if (!MODES.includes(d.mode)) fail(`mode must be one of ${MODES.join(', ')}`);
    if (typeof d.agenda !== 'string' || !d.agenda.trim()) fail('agenda is empty');
    const units = d.units;
    if (!units || typeof units !== 'object' || Object.keys(units).sort().join() !== 'balthasar,casper,melchior')
        fail('units must contain exactly melchior, balthasar, casper');
    if (d.mode === 'deliberation') {
        if (!GRADES.includes(d.grade)) fail(`grade must be one of ${GRADES.join(', ')}`);
        if (!VERDICTS.includes(d.verdict)) fail(`verdict must be one of ${VERDICTS.join(', ')}`);
        for (const u of UNITS)
            if (!UNIT_VERDICTS.includes((units[u.key] || {}).verdict)) fail(`units.${u.key}.verdict must be one of ${UNIT_VERDICTS.join(', ')}`);
        if (d.follow_ups !== undefined) {
            if (!Array.isArray(d.follow_ups) || d.follow_ups.length > 2) fail('follow_ups must be a list of at most 2');
            d.follow_ups.forEach((f, i) => {
                if (!f || typeof f.agenda !== 'string') fail(`follow_ups[${i}].agenda is missing`);
                if (!VERDICTS.includes(f.verdict)) fail(`follow_ups[${i}].verdict must be one of ${VERDICTS.join(', ')}`);
                if (f.units !== undefined) for (const u of UNITS)
                    if (!f.units[u.key] || !UNIT_VERDICTS.includes(f.units[u.key].verdict))
                        fail(`follow_ups[${i}].units.${u.key}.verdict must be one of ${UNIT_VERDICTS.join(', ')}`);
            });
        }
    }
}

// --- status lines: CODE from the file name's time, EXTENTION the preset, PRIORITY the grade ---
function presetCode(preset) {
    let head = String(preset || '').trim().toLowerCase();
    head = head.split('—')[0].split(' - ')[0].split(':')[0].split('(')[0];
    for (const [words, code] of PRESETS)
        if (words.some(w => head.startsWith(w) || head.includes(' ' + w))) return code;
    return head ? 'CUSTOM' : '----';
}
function statusFields(d, file) {
    if (!d) return { code: '473', ext: '????', priority: 'AAA' };
    const m = /^\d{8}-(\d{4})\d{2}-/.exec(file.name);
    const time = m ? m[1] : new Date(file.lastModified).toTimeString().slice(0, 5).replace(':', '');
    const priority = { critical: 'AAA', normal: 'A' }[d.grade] || '----';
    return { code: time, ext: presetCode(d.preset), priority };
}

// --- rendering ---
let current = null;      // { data, file }
let selected = null;     // unit key

function renderStatus(d, file) {
    const s = statusFields(d, file);
    $('status').replaceChildren(
        el('div', { class: 'code' }, `CODE:${s.code}`),
        el('div', {}, 'FILE:MAGI_SYS'),
        el('div', {}, `EXTENTION:${s.ext}`),
        el('div', {}, 'EX_MODE:OFF'),
        el('div', {}, `PRIORITY:${s.priority}`));
}

function noteFor(d) {
    if (d.mode !== 'deliberation') return '';
    const n = d.approve_count ?? UNITS.filter(u => d.units[u.key].verdict === 'approve').length;
    if (d.verdict === 'on_hold') return T.hold;
    if (d.verdict === 'error') return T.unitError;
    if (d.verdict === 'passed' && n < 3) return T.majority(n);
    if (d.verdict === 'rejected' && d.grade === 'critical' && (n === 1 || n === 2)) return T.unanimity(n);
    return '';
}

function render() {
    const d = current && current.data;
    $('agenda').textContent = d ? d.agenda : T.waiting;
    renderStatus(d, current && current.file);

    const key = !d ? 'information' : d.mode === 'information' ? 'information' : d.verdict;
    const badge = BADGE[key];
    $('badge').style.color = badge.color;
    $('badge-text').textContent = badge.kanji;
    const n = d && d.mode === 'deliberation' ? (d.approve_count ?? UNITS.filter(u => d.units[u.key].verdict === 'approve').length) : null;
    $('count').textContent = d ? (d.mode === 'deliberation'
        ? `${T[d.verdict] || d.verdict} · ${T.approvals(n)} · ${T[d.grade]}${d.grade_raised ? ' ↑' : ''}`
        : T.information) : '';
    $('note').textContent = d ? noteFor(d) : '';

    const units = UNITS.map(u => {
        const unit = d ? d.units[u.key] : null;
        const state = !unit ? 'idle' : d.mode === 'information' ? 'info' : unit.verdict;
        const btn = el('button', { class: `unit ${u.key}${selected === u.key ? ' selected' : ''}`, type: 'button' },
            el('div', { class: 'face', style: { background: FACE[state] } },
                el('div', { class: 'name' }, `${u.name} • ${u.n}`),
                unit && unit.perspective ? el('div', { class: 'perspective' }, unit.perspective) : null));
        btn.addEventListener('click', () => { if (d) { selected = u.key; render(); } });
        return btn;
    });
    $('units').replaceChildren(...units, el('div', { class: 'core' }, 'MAGI'));
    renderDetails(d);
}

function list(items) {
    return el('ul', {}, ...items.map(i => el('li', {}, String(i))));
}

function renderDetails(d) {
    const box = $('details');
    if (!d) { box.replaceChildren(el('span', { class: 'muted' }, T.waiting)); return; }
    const parts = [];
    if (!selected) {
        parts.push(el('div', { class: 'muted' }, T.clickUnit));
    } else {
        const u = UNITS.find(x => x.key === selected);
        const unit = d.units[selected];
        const rows = [];
        const add = (label, value) => { if (value !== undefined && value !== null && value !== '' && !(Array.isArray(value) && !value.length)) rows.push(el('dt', {}, label), el('dd', {}, Array.isArray(value) ? list(value) : String(value))); };
        add(T.perspective, unit.perspective);
        if (d.mode === 'information') {
            add(T.answer, unit.answer);
        } else {
            add(T.verdict, [T[unit.verdict] || unit.verdict, unit.confidence ? `${T.confidence} ${T[unit.confidence] || unit.confidence}` : ''].filter(Boolean).join(' · '));
            add(T.error, unit.error);
            add(T.rationale, unit.rationale);
            add(T.flip, unit.flip_condition);
            add(T.premise, unit.doubted_premise);
            add(T.recommend, unit.recommendations);
            (d.follow_ups || []).forEach((f, i) => {
                const fu = f.units && f.units[selected];
                if (!fu) return;
                const n = f.approve_count ?? UNITS.filter(x => f.units[x.key].verdict === 'approve').length;
                add(`${T.followUp} ${i + 1}`, [f.agenda, `${T[f.verdict] || f.verdict} (${n}/3) — ${T[fu.verdict] || fu.verdict}${fu.confidence ? ' · ' + (T[fu.confidence] || fu.confidence) : ''}`, ...(fu.rationale || []), fu.error || ''].filter(Boolean));
            });
        }
        parts.push(el('h2', {}, `${u.name} • ${u.n}`), el('dl', {}, ...rows));
    }
    if (d.minority) parts.push(el('dl', { style: { marginTop: '10px' } }, el('dt', {}, T.minority), el('dd', {}, d.minority)));
    box.replaceChildren(...parts);
}

function showError(message, file) {
    current = null; selected = null;
    render();
    $('agenda').replaceChildren(el('span', { class: 'error-text' }, message));
    $('badge').style.color = BADGE.error.color;
    $('badge-text').textContent = BADGE.error.kanji;
    $('count').textContent = file ? file.name : '';
}

// --- loading ---
let files = [];
function sortNewest(list) {
    return list.slice().sort((a, b) => (b.name > a.name) - (b.name < a.name) || b.lastModified - a.lastModified);
}
function setFiles(incoming) {
    files = sortNewest([...incoming].filter(f => f.name.toLowerCase().endsWith('.json')));
    const sel = $('results');
    sel.replaceChildren(...(files.length ? files.map((f, i) => el('option', { value: String(i) }, f.name)) : [el('option', {}, T.none)]));
    if (files.length) open(files[0]);
}
async function open(file) {
    let data;
    try {
        data = JSON.parse(await file.text());
    } catch (e) {
        return showError(T.json(e.message), file);
    }
    try {
        validate(data);
    } catch (e) {
        if (e instanceof ResultError) return showError(T.invalid(e.message), file);
        throw e;
    }
    current = { data, file };
    selected = null;
    render();
}

$('label-folder').textContent = T.folder;
$('label-files').textContent = T.files;
$('pick-folder').addEventListener('change', e => setFiles(e.target.files));
$('pick-files').addEventListener('change', e => setFiles(e.target.files));
$('results').addEventListener('change', e => { const f = files[Number(e.target.value)]; if (f) open(f); });
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('over'); });
document.addEventListener('dragleave', () => document.body.classList.remove('over'));
document.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('over'); setFiles(e.dataTransfer.files); });

$('results').replaceChildren(el('option', {}, T.none));
render();
</script>
</body>
</html>
